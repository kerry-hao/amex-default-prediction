[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amex-default-learning"
version = "0.1.0"
description = "Customer-level American Express default prediction with LightGBM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<4", "pyarrow>=17,<27",
  "duckdb>=1.1,<3", "lightgbm>=4.5,<5", "scikit-learn>=1.7,<2",
  "matplotlib>=3.8,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "nbformat>=5.10,<6"]
notebook = ["jupyterlab>=4,<5", "ipykernel>=6,<8"]

[project.scripts]
amex = "amex_default.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
